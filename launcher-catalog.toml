tagline = "Tool hub for 3ds Max"
[apps.details]
headline = "Everyday 3ds Max tools in one install."
about = "OpenTools gathers scene checks and repairs, asset, proxy and XRef managers, modeling, material and clipboard tools in one dockable panel, a searchable command palette and macros you can bind to hotkeys.\n\nOne package installs every tool, and every 3ds Max from 2025 on picks it up."
platforms = "Windows, 3ds Max 2025 and later"
[[apps.details.features]]
title = "One panel"
text = "Every tool in a dockable panel with categories, favourites and search."
[[apps.details.features]]
title = "Command palette"
text = "Find and run any tool by typing its name."
[[apps.details.features]]
title = "Scene checks"
text = "The Auditor finds and repairs common scene problems."
[[apps.details.features]]
title = "Clipboard"
text = "Copy and paste objects between scenes and computers."

