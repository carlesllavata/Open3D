[package]
name = "open3d-launcher"
version = "0.1.0"
edition = "2024"
description = "Installs, updates and removes the Open3D apps for 3ds Max"
license = "GPL-3.0-or-later"
repository = "https://github.com/carlesllavata/Open3D"

[dependencies]
eframe = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.1"
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[profile.release]
# One small exe to download: strip symbols and optimise across crates.
strip = true
lto = true
codegen-units = 1
