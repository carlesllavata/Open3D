headline = "The street outside, as a 16K panorama."
about = "OpenView downloads 360 panoramas and photos from map applications at full resolution, up to 16384 × 8192 px, and saves them as standard equirectangular images. Look around them in a 360 viewer, cut ordinary photos out of them and turn them into HDRIs.\n\nIt is a program of its own: it does not need 3ds Max."
platforms = "Windows 10 or 11 (64-bit)"
[[apps.details.features]]
title = "Full resolution"
text = "Panoramas of up to 16384 × 8192 px, and 360 photos and ordinary photos at the size they were uploaded."
[[apps.details.features]]
title = "Level horizon"
text = "Straightens panoramas taken with a leaning camera, so the verticals of buildings stay vertical."
[[apps.details.features]]
title = "Crops"
text = "Frame a view in the 360 viewer and save it as an ordinary photo."
[[apps.details.features]]
title = "HDRI"
text = "Turn a panorama into an EXR or .hdr with a sun, to light a scene."

