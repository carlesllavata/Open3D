headline = "Turn photos into a walkable 3D scene."
about = "OpenGaussian trains 3D Gaussian Splatting scenes from your photos, shows them in real time while they train, and lets you select, edit and export the splats to PLY, SOG, SPZ, USD or a web viewer.\n\nIt is a program of its own, based on LichtFeld Studio, and needs an NVIDIA graphics card (GTX 16 or RTX 20 series or newer)."
platforms = "Windows 10 or 11 (64-bit), NVIDIA GTX 16 or RTX 20 series or newer"
[[apps.details.features]]
title = "Training"
text = "Turns a set of photos into a splat scene on your graphics card, and resumes from checkpoints."
[[apps.details.features]]
title = "Live view"
text = "Look around the scene while it trains and inspect it in real time."
[[apps.details.features]]
title = "Editing"
text = "Select, move and delete splats, with undo and redo."
[[apps.details.features]]
title = "Export"
text = "Save to PLY, SOG, SPZ or USD, or as a web page anyone can open."

