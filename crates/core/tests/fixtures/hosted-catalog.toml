about = "OpenManager keeps setups inside your .max file: camera, resolution, frames, sun, dome, environment, layers, objects, lights, output path and render settings. Click a setup and the scene follows; Batch Render renders every ticked setup one after the other.\n\nIt works with Corona and V-Ray, and reads setups made with Pulze Scene Manager."
platforms = "Windows, 3ds Max 2025 and later"
[[apps.details.features]]
title = "Setups"
text = "Camera, lights, layers, objects and render settings saved per shot, inside the .max file."
[[apps.details.features]]
title = "Batch render"
text = "Render every ticked setup in a row, saving each output where the setup says."
[[apps.details.features]]
title = "Pulze setups"
text = "Setups made with Pulze Scene Manager are read and converted."
[[apps.details.features]]
title = "Corona and V-Ray"
text = "Render settings, overrides and the Corona post-production travel with each setup."

